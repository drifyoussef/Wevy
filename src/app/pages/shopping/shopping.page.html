<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar class="transparent-toolbars">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/home" text=""></ion-back-button>
    </ion-buttons>
    <ion-title class="text-2xl">Courses</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <!-- Ajout rapide -->
  <div class="quick-add">
    <ion-input
      [(ngModel)]="newItemName"
      (keyup.enter)="quickAdd()"
      placeholder="Ajouter un produit..."
      fill="outline"
      class="custom-input quick-add-input"
    ></ion-input>
    <button class="quick-add-btn" (click)="quickAdd()" [disabled]="!newItemName.trim() || adding" aria-label="Ajouter">
      <ion-icon name="add"></ion-icon>
    </button>
  </div>

  <!-- Articles à acheter -->
  <div class="mb-6">
    <h2 class="text-xl mb-4">À acheter</h2>
    
    @if (uncheckedItems.length > 0) {
      <div class="tasks-list">
        @for (item of uncheckedItems; track item.id) {
          <div class="task-card" [class.removing]="removingIds.has(item.id)">
            <button class="task-dot-btn" (click)="toggleItem(item.id)" aria-label="Marquer comme acheté">
              <span class="task-dot"></span>
            </button>

            <div class="task-info">
              <span class="task-title">{{ item.name }}</span>
            </div>

            <button class="task-delete-badge" (click)="deleteItem(item.id)" aria-label="Supprimer le produit">
              <ion-icon name="close"></ion-icon>
            </button>
          </div>
        }
      </div>
    } @else {
      <div class="bg-muted rounded-xl p-6 text-center">
        <p class="text-sm text-gray-500">Aucun produit à acheter - C'est bon! 🎉</p>
      </div>
    }
  </div>

  <!-- Articles cochés -->
  @if (checkedItems.length > 0) {
    <div class="mb-6">
      <h2 class="text-xl mb-4">Acheté</h2>
      
      <div class="tasks-list">
        @for (item of checkedItems; track item.id) {
          <div class="task-card completed" [class.removing]="removingIds.has(item.id)">
            <button class="task-dot-btn" (click)="toggleItem(item.id)" aria-label="Marquer comme à acheter">
              <span class="task-dot filled"></span>
            </button>

            <div class="task-info">
              <span class="task-title">{{ item.name }}</span>
            </div>

            <button class="task-delete-badge" (click)="deleteItem(item.id)" aria-label="Supprimer le produit">
              <ion-icon name="close"></ion-icon>
            </button>
          </div>
        }
      </div>
    </div>
  }
</ion-content>
