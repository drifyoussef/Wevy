<ion-header class="ion-no-border">
  <ion-toolbar>
    <div class="header-content">
      <p class="date-label">{{ todayLabel }}</p>
      <ion-title class="text-3xl greeting-title">Bonjour {{ displayName }} 👋</ion-title>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Mes applications -->
  <div class="mb-6">
    <h2 class="text-xl mb-3">Mes applications</h2>
    <div class="app-grid">
      @for (tile of appTiles; track tile.label) {
        <button class="app-tile" (click)="goToTile(tile)">
          <span class="app-tile-label">{{ tile.label }}</span>
          <span class="app-tile-icon-clip">
            <span class="app-tile-icon">
              <ion-icon [name]="tile.icon"></ion-icon>
            </span>
          </span>
          @if (tile.badge) {
            <span class="app-tile-badge">{{ tile.badge }}</span>
          }
        </button>
      }
    </div>
  </div>
</ion-content>
