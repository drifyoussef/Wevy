<ion-content [fullscreen]="true" class="welcome-content">
  <div class="welcome-container">
    <!-- Brand visual: the Mesnia symbol (same shapes as assets/brand/*.svg, without its square) -->
    <div class="hero-brand">
      <div class="hero-symbol">
        <svg viewBox="8 12 104 92" aria-hidden="true">
          <path d="M20 58 L60 24 L100 58" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="31" cy="88" r="11" fill="#FFFFFF" />
          <circle cx="60" cy="82" r="13" fill="#FFFFFF" />
          <circle cx="89" cy="88" r="11" fill="#FFFFFF" />
        </svg>
      </div>
      <span class="hero-name">Mesnia</span>
    </div>

    <div class="hero-copy">
      <h1 class="app-tagline">Votre foyer,<br />enfin organisé ensemble</h1>
      <p class="app-subtitle">Tâches, courses, recettes, agenda et horaires : tout le foyer au même endroit, sans prise de tête.</p>
    </div>

    <div class="features-row">
      <div class="feature-chip">
        <span class="feature-icon-clay">
          <ion-icon name="checkmark-done-outline"></ion-icon>
        </span>
        <span class="feature-chip-label">Tâches</span>
      </div>

      <div class="feature-chip">
        <span class="feature-icon-clay">
          <ion-icon name="cart-outline"></ion-icon>
        </span>
        <span class="feature-chip-label">Courses</span>
      </div>

      <div class="feature-chip">
        <span class="feature-icon-clay">
          <ion-icon name="sparkles-outline"></ion-icon>
        </span>
        <span class="feature-chip-label">Recettes IA</span>
      </div>

      <div class="feature-chip">
        <span class="feature-icon-clay">
          <ion-icon name="calendar-outline"></ion-icon>
        </span>
        <span class="feature-chip-label">Agenda</span>
      </div>
    </div>

    <div class="action-section">
      <ion-button
        expand="block"
        size="large"
        (click)="goToLogin()"
        class="primary-button"
      >
        Commencer
      </ion-button>
    </div>
  </div>
</ion-content>
